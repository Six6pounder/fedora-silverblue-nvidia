---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: sixpounder-cosmic
# description will be included in the image's metadata
description: A custom Fedora COSMIC atomic image for my personal use, with NVIDIA (open kernel modules) drivers baked in. It includes various tools and configurations for my workflow, such as NordVPN, Brave Origin, and Podman. The image is designed to be lightweight and efficient, while still providing all the necessary features for my daily tasks.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/blue-build/base-images/fedora-cosmic-nvidia-open
image-version: latest # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      files:
        - nordvpn.repo
        - 1password.repo
        - tabby.repo
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
        - https://copr.fedorainfracloud.org/coprs/codifryed/CoolerControl/repo/fedora-%OS_VERSION%/codifryed-CoolerControl-fedora-%OS_VERSION%.repo
        - https://copr.fedorainfracloud.org/coprs/lizardbyte/stable/repo/fedora-%OS_VERSION%/lizardbyte-stable-fedora-%OS_VERSION%.repo
      keys:
        - https://repo.nordvpn.com/gpg/nordvpn_public.asc
        - https://downloads.1password.com/linux/keys/1password.asc
        - https://packagecloud.io/eugeny/tabby/gpgkey
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
      # rpmfusion-free provides the VirtualBox userspace + akmod-VirtualBox
      nonfree: rpmfusion
    install:
      skip-unavailable: true
      packages:
        - fish
        - zoxide
        - aria2
        - policycoreutils
        - policycoreutils-python-utils
        - podman-docker
        - podman-compose
        - liquidctl
        - coolercontrol
        - coolercontrold
        - brave-origin
        - nordvpn
        # The `bling` 1Password installer uses rpm-ostree, which cannot run
        # inside bootc's container build. Install from the official RPM repo
        # through the dnf module instead.
        - 1password
        - 1password-cli
        # Sunshine game-stream host (LizardByte COPR); ships udev rules + setcap
        # for KMS capture, which the Flatpak/AppImage builds lack.
        - Sunshine
        # Flutter Linux desktop build toolchain
        - clang
        - cmake
        - ninja-build
        - pkgconf-pkg-config
        - gtk3-devel
        - xz-devel
        # Tauri (Rust desktop) build deps (gtk3-devel shared with Flutter above)
        - webkit2gtk4.1-devel
        - libsoup3-devel
        - openssl-devel
        - librsvg2-devel
        # Unsloth Studio's native installer (unsloth.ai/install.sh) builds
        # llama.cpp from source and needs libcurl headers for it; everything
        # else it needs (git, gcc, cmake, pciutils, uv) is already covered.
        - libcurl-devel
        # Tabby terminal, from upstream's packagecloud repo (see tabby.repo for
        # why it points at EL 9 rather than Fedora).
        - tabby-terminal
        # Runtime bits Claude Desktop only Recommends (so install-claude-desktop.sh
        # below does not pull them in): the appindicator tray icon, and the
        # qemu/OVMF/virtiofs stack its Cowork tab uses to sandbox agents in a VM.
        - libayatana-appindicator-gtk3
        - qemu-system-x86-core
        - edk2-ovmf
        - virtiofsd

  # VirtualBox has no official Flatpak (it needs host kernel modules) and is not
  # in the prebuilt ublue akmods set, so compile vboxdrv against this image's
  # kernel at build time and bake it in. Runs after the dnf module so rpmfusion
  # is already enabled.
  - type: script
    scripts:
      - build-virtualbox.sh

  # xone is an out-of-tree DKMS driver for Xbox One/Series controllers and the
  # GIP wireless dongle. Atomic images have no runtime DKMS rebuild, so compile
  # it against this image's kernel at build time and bake the modules in (same
  # approach as build-virtualbox.sh above).
  - type: script
    scripts:
      - build-xone.sh

  # Open the Sunshine firewall ports. Runs after the files module so the
  # /usr/lib/firewalld/services/sunshine.xml service definition already exists.
  - type: script
    scripts:
      - setup-firewall.sh

  # Apply the fixed runtime group IDs required by 1Password's privileged helper
  # after the packages have been installed by dnf above.
  - type: script
    scripts:
      - setup-1password.sh

  # Claude Desktop ships only as a .deb from Anthropic's own apt repo, with no
  # RPM or Flatpak, so unpack it into the image (see the script for why that is
  # safe here). Runs after dnf so its ldd check sees the final library set.
  - type: script
    scripts:
      - install-claude-desktop.sh

  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - com.github.tchx84.Flatseal
          - com.valvesoftware.Steam
          # NB: the MangoHud Vulkan overlay for Steam is NOT listed here. Its
          # branch must match Steam's freedesktop runtime, which changes over
          # time, so a static entry would go stale. mangohud-steam-sync (run as
          # ExecStartPost of system-flatpak-setup.service) installs the matching
          # branch automatically right after Steam is set up.
          - io.missioncenter.MissionCenter
          - org.gnome.Loupe
          - org.mozilla.thunderbird_esr
          - dev.zed.Zed
          - dev.vencord.Vesktop
          - com.github.IsmaelMartinez.teams_for_linux
          - com.github.Matoking.protontricks
          - com.vysp3r.ProtonPlus
          - com.usebottles.bottles
          - com.heroicgameslauncher.hgl
          - io.github.Faugus.faugus-launcher
          # Unreal Engine itself can't be baked into the image: downloading it
          # requires an Epic account login, the EULA forbids redistributing it
          # in a public image, and it weighs 25-40 GB. Epic Asset Manager logs
          # into your Epic account and installs/updates engine versions under
          # $HOME instead.
          - io.github.achetagames.epic_asset_manager
          - com.ranfdev.DistroShelf

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode # don't add spaces or "Nerd Font" suffix
      google-fonts:
        - Roboto
        - Open Sans
        - Inter

  - type: systemd
    system:
      enabled:
        - nordvpnd
        - coolercontrold
        # OpenSSH server. openssh-server ships in the base image and the 'ssh'
        # firewalld service is already in the default zone, but Fedora atomic
        # leaves sshd disabled -- enable it here so remote login works out of
        # the box. Hardening (key-only auth) lives in the sshd_config.d drop-in.
        - sshd
    user:
      enabled:
        - podman.socket
        # real unit name; RPM only aliases it to sunshine.service once enabled
        - app-dev.lizardbyte.app.Sunshine.service

  - type: signing
