---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: sixpounder-gnome
# description will be included in the image's metadata
description: A custom Fedora GNOME (Silverblue) atomic image for my personal use, with NVIDIA (open kernel modules) drivers baked in. It includes various tools and configurations for my workflow, such as NordVPN, Brave Origin, and Podman. The image is designed to be lightweight and efficient, while still providing all the necessary features for my daily tasks.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/blue-build/base-images/fedora-silverblue-nvidia-open
image-version: latest # latest is also supported if you want new updates ASAP

# Everything is shared with the COSMIC and KDE variants -- see common.yml. Add
# per-DE modules below the include only when they genuinely differ by desktop.
modules:
  - from-file: common.yml

  # The extension set this repo shipped back when it was GNOME-only, restored
  # from the recipe as it was before the switch to COSMIC (commit 1a4649d).
  # All five list GNOME 50 (Fedora 44's Shell) as supported.
  #
  # AppIndicator is the one that is not cosmetic: GNOME Shell has no native
  # notification area, so without it the tray icons the shared apps rely on
  # (Claude Desktop, 1Password, CoolerControl) have nowhere to appear.
  - type: gnome-extensions
    install:
      - 3193 # Blur my Shell
      - 615 # AppIndicator and KStatusNotifierItem Support
      - 307 # Dash-to-Dock
      - 517 # Caffeine
      - 4691 # Pip On Top

  # Manages the extensions above (updates, per-extension settings). GNOME-only,
  # so it stays out of common.yml.
  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - com.mattjakeman.ExtensionManager
