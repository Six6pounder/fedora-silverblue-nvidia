# network-online.target only means NetworkManager activated a connection with
# an IP -- it does NOT guarantee DNS is answering yet. The setup service fires
# the same millisecond the target is reached, so on some boots the very first
# flathub lookup hits "Could not resolve hostname" and the whole oneshot fails
# with no retry (it's a OnBootSec timer). Block here until flathub actually
# resolves, up to ~60s, before letting the install run.
[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 30); do getent hosts dl.flathub.org >/dev/null 2>&1 && exit 0; sleep 2; done; echo "DNS not ready for dl.flathub.org after 60s" >&2; exit 1'
