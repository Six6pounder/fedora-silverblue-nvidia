# Sync the MangoHud Vulkan layer's branch to the Flatpak Steam's runtime right
# after the system flatpaks are installed/updated. The leading "-" makes the
# step best-effort: a failure here (e.g. no network) must not fail the whole
# flatpak-setup run. See /usr/bin/mangohud-steam-sync.
[Service]
ExecStartPost=-/usr/bin/mangohud-steam-sync
