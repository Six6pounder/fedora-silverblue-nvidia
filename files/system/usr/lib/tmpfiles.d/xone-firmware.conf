# Create the writable firmware dir that xone-get-firmware.sh writes into (and
# that the firmware_class.path karg in
# /usr/lib/bootc/kargs.d/xone-firmware.toml points the kernel at). /var is
# per-machine on atomic, so it is materialised at boot via tmpfiles rather than
# shipped in the image.
d /var/lib/firmware 0755 root root -
