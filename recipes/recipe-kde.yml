---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: sixpounder-kde
# description will be included in the image's metadata
description: A custom Fedora KDE Plasma (Kinoite) atomic image for my personal use, with NVIDIA (open kernel modules) drivers baked in. It includes various tools and configurations for my workflow, such as NordVPN, Brave Origin, and Podman. The image is designed to be lightweight and efficient, while still providing all the necessary features for my daily tasks.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/blue-build/base-images/fedora-kinoite-nvidia-open
image-version: latest # latest is also supported if you want new updates ASAP

# Everything is shared with the COSMIC and GNOME variants -- see common.yml. Add
# per-DE modules below the include only when they genuinely differ by desktop.
modules:
  - from-file: common.yml
