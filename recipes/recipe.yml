---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: sixpounder-origami
# description will be included in the image's metadata
description: A custom image for my personal use, built with Origami. It includes various tools and configurations for my workflow, such as NordVPN, Brave Browser, and Podman. The image is designed to be lightweight and efficient, while still providing all the necessary features for my daily tasks.

# the base image to build on top of (FROM) and the version tag to use
base-image: registry.gitlab.com/origami-linux/images/origami-nvidia
image-version: latest # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      files:
        - nordvpn.repo
        - antigravity.repo
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      copr:
        - codifryed/CoolerControl
      keys:
        - https://repo.nordvpn.com/gpg/nordvpn_public.asc
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
    install:
      skip-unavailable: true # skip unavailable packages
      packages:
        - podman-docker
        - podman-compose
        - liquidctl
        - coolercontrol
        - coolercontrold
        - brave-browser
        - nordvpn
        - antigravity

  - type: bling
    install:
      - 1password

  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - com.github.tchx84.Flatseal
          - com.valvesoftware.Steam
          - io.missioncenter.MissionCenter
          - org.gnome.Loupe
          - org.mozilla.Thunderbird
          - com.vysp3r.ProtonPlus

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode # don't add spaces or "Nerd Font" suffix
      google-fonts:
        - Roboto
        - Open Sans
        - Inter

  - type: systemd
    system:
      enabled:
        - nordvpnd
        - coolercontrold
    user:
      enabled:
        - podman.socket

  - type: signing
