# If the setup run fails (e.g. transient network/DNS trouble that outlasts the
# 20-wait-dns.conf grace period), a OnBootSec timer would not retry until the
# next boot. Hand off to system-flatpak-setup-retry.timer instead, which re-runs
# this service in 2 minutes -- and re-arms itself on each further failure until
# the install succeeds.
[Unit]
OnFailure=system-flatpak-setup-retry.timer
