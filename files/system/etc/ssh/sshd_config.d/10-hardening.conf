# SSH hardening for this image. Drop-ins in sshd_config.d/ override the stock
# /etc/ssh/sshd_config, and the first matching value wins, so this file is
# numbered low (10-) to take precedence over the distro defaults.
#
# Key-only auth: passwords are disabled, so a baked-in authorized key (see
# /etc/ssh/authorized_keys.d/) is required to log in. Make sure your key is in
# place BEFORE deploying an image with this drop-in, or you will be locked out.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no

# Honour the per-user file in the home dir AND a single shared file baked into
# the image. The shared file is username-independent (no %u), so it grants the
# baked key to any login account -- root is still excluded by PermitRootLogin
# no above. Fine for a personal single-user machine; revisit if you ever add
# other human accounts. /var/home does not exist at build time on atomic, hence
# the system-wide path.
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/baked_authorized_keys
